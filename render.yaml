services:
  - type: web
    name: agentic-ecosystem-simulator
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements-render.txt
    startCommand: python app_modal_deployed_clean.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false
